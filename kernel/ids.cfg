# kernel/ids.cfg — config fragment merged by P2 (PetaLinux) and P4 (Buildroot).   Owner: P1
# --- firewall: nftables with sets, connection tracking, rate limits ---
CONFIG_NETFILTER=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
# added 2026-11-20: P4's Buildroot build needed it for the nft rules
CONFIG_NF_TABLES_IPV4=y
# added 2026-11-20: same reason
CONFIG_NFT_COUNTER=y
CONFIG_NFT_CT=y
CONFIG_NFT_LIMIT=y
CONFIG_NFT_REJECT=y
# --- read-only root with a writable overlay ---
CONFIG_OVERLAY_FS=y
# --- FPGA manager: load bitstreams from Linux (used when the board arrives) ---
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQ_FPGA=y
CONFIG_FPGA_BRIDGE=y
CONFIG_FPGA_REGION=y
CONFIG_OF_FPGA_REGION=y
CONFIG_OF_OVERLAY=y
CONFIG_OF_CONFIGFS=y
# --- user-space I/O for the accelerator's registers ---
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
# --- hardening ---
CONFIG_STRICT_DEVMEM=y
# added 2026-11-20: systemd ProtectHostname=yes had no effect on P2's kernel
CONFIG_NAMESPACES=y
# because UTS_NS was missing; NOT yet rebuilt/verified on either image
CONFIG_UTS_NS=y
# --- things an intrusion-detection appliance never needs (trim; record size before/after) ---
# CONFIG_SOUND is not set
# CONFIG_DRM is not set
# CONFIG_FB is not set
# CONFIG_MEDIA_SUPPORT is not set
# CONFIG_WLAN is not set
# CONFIG_BT is not set
# CONFIG_INPUT_JOYSTICK is not set
# CONFIG_INPUT_TOUCHSCREEN is not set
