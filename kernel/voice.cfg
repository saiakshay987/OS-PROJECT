# kernel/voice.cfg  — merged by P2 (PetaLinux) and P4 (Buildroot)
# --- USB microphone ---
CONFIG_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_CHIPIDEA=y
CONFIG_USB_CHIPIDEA_HOST=y
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=y
# --- FPGA manager: load bitstreams from Linux ---
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQ_FPGA=y
CONFIG_FPGA_BRIDGE=y
CONFIG_FPGA_REGION=y
CONFIG_OF_FPGA_REGION=y
CONFIG_OF_OVERLAY=y
CONFIG_OF_CONFIGFS=y
# --- user-space I/O for DMA registers + DMA buffer ---
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
# --- keep /dev/mem locked down; we use UIO instead (good security story) ---
CONFIG_STRICT_DEVMEM=y
