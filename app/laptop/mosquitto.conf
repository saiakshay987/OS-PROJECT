# app/laptop/mosquitto.conf — broker on the demo laptop.   mosquitto -c app/laptop/mosquitto.conf
listener 1883 0.0.0.0
# without this line every message waits about 40 ms (measured): it turns off TCP batching
set_tcp_nodelay true
# Day-1 testing only. For the demo switch to a password file + ACL (security/mqtt-auth.md)
allow_anonymous true
