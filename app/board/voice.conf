# /etc/voice/voice.conf — defaults baked into the read-only image (installed by the recipe)
# systemd EnvironmentFile rule: comments only on their own lines, never after a value.
# BACKEND: fpga | arm   (arm = fallback + the 'without FPGA' measurement)
BACKEND=fpga
# VAD: on | off   (off = publish every window: the 'without VAD' measurement)
VAD=on
VAD_MARGIN_DB=9
# MIC_DEVICE: check with 'arecord -l' on the board
MIC_DEVICE=plughw:1,0
BROKER=192.168.2.1
MQTT_USER=board
# MQTT_PASS is NOT here. Put it only in /data/voice.conf (writable partition):
#   sudo install -m 600 -o root -g root /dev/null /data/voice.conf
#   echo 'MQTT_PASS=...' | sudo tee -a /data/voice.conf
# Any line in /data/voice.conf overrides the default above, e.g. BACKEND=arm for a benchmark run.
