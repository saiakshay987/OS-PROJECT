# /etc/ids/ids.conf — defaults baked into the read-only image. Overrides go in /data/ids.conf.
# systemd EnvironmentFile rule: comments only on their own lines.
# INPUT: mqtt (works through QEMU's NAT) | udp (board on a real LAN, port LISTEN_PORT)
INPUT=mqtt
# address of the laptop running Mosquitto. From inside QEMU the host is 10.0.2.2.
BROKER=10.0.2.2
# BACKEND: arm (integer model on the CPU) | fpga (board only)
BACKEND=arm
# ROTATE: off | fixed | poisson | event      ROTATE_S = (mean) seconds between swaps
ROTATE=poisson
ROTATE_S=30
# SWAP_MS: with BACKEND=arm, pretend each swap takes this long (207 = Xilinx's fpgautil figure for the same chip)
SWAP_MS=207
# FALLBACK during a swap: arm (fixed software model) | hold (queue, classify late) | open (pass unchecked)
FALLBACK=arm
# BLOCK: nft (add the source address to the 'blocked' set) | log (print only)
BLOCK=nft
BLOCK_TTL=60s
