#!/usr/sbin/nft -f
# security/nftables.conf — default deny, both directions
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip saddr 192.168.2.0/24 tcp dport 22 ct state new limit rate 10/minute accept   # SSH from lab LAN only
    icmp type echo-request limit rate 5/second accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output {
    type filter hook output priority 0; policy drop;
    oif "lo" accept
    ct state established,related accept
    ip daddr 192.168.2.1 tcp dport 1883 accept                                    # MQTT to the laptop only
    udp dport { 53, 123 } accept                                                  # DNS, NTP
  }
}
