# OpenSSH: /etc/ssh/sshd_config.d/10-hardening.conf
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AllowUsers admin
MaxAuthTries 3
X11Forwarding no
AllowTcpForwarding no

# Dropbear equivalent (smaller): start with  dropbear -s -w -g
#   -s disable password logins   -w disallow root logins   -g disable password logins for root
