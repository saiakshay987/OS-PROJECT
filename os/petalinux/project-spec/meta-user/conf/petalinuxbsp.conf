#User Configuration

#OE_TERMINAL = "tmux"
IMAGE_BOOT_FILES:zynq = "BOOT.BIN boot.scr uImage rootfs.cpio.gz.u-boot"
INHERIT += "rm_work"
EXTRA_IMAGE_FEATURES += "read-only-rootfs"

# LAB ONLY: build-time account 'petalinux', password not expired.
# Overrides EXTRA_USERS_PARAMS from build/conf/plnxtool.conf (generated from
# CONFIG_ADD_EXTRA_USERS, which adds "passwd-expire").
# Replace <SHA512_HASH_OF_LAB_PASSWORD> below with a sha512-crypt hash, generated with:
#     openssl passwd -6
# and escape every '$' as '\$' for bitbake. The lab password is shared with the team
# directly; never commit the real password or its hash.
EXTRA_USERS_PARAMS = "\
    groupadd -r aie; \
    useradd -p '<SHA512_HASH_OF_LAB_PASSWORD>' petalinux; \
    usermod -a -G aie,audio,input,video petalinux; \
"
