#!/usr/sbin/nft -f
# security/nftables.conf — default deny in both directions + the 'blocked' set the detector fills.   Owner: P4
flush ruleset
table inet filter {
  set blocked {                       # idsd adds attacker addresses here; entries expire by themselves
    type ipv4_addr
    flags timeout
  }
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr @blocked counter drop                      # first rule: blocked sources get nothing
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    udp dport 5555 limit rate 5000/second accept        # flow records (INPUT=udp)
    tcp dport 22 ct state new limit rate 10/minute accept
    icmp type echo-request limit rate 5/second accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    ip saddr @blocked counter drop
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif "lo" accept
    ct state established,related accept
    tcp dport 1883 accept                               # MQTT to the laptop (tighten to its address on a real LAN)
    udp dport { 53, 123 } accept
  }
}
